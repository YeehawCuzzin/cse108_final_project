<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}FlowFundAI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div>
      <div class="logo-box">
        <div class="logo-text">FlowFund<span>AI</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
          <span class="icon">📊</span> Dashboard
        </a>
        <a href="{{ url_for('transactions_page') }}" class="nav-item {% if request.endpoint == 'transactions_page' %}active{% endif %}">
          <span class="icon">💸</span> Transactions
        </a>
        <a href="{{ url_for('budgets_page') }}" class="nav-item {% if request.endpoint == 'budgets_page' %}active{% endif %}">
          <span class="icon">🎯</span> Budgets
        </a>
      </nav>
    </div>
    <div class="sidebar-footer">
      {% if session.user_name %}
      <strong>{{ session.user_name }}</strong>
      {% else %}
      <strong>FlowFundAI</strong>
      {% endif %}
      <p>AI-powered budgeting for smarter decisions.</p>
      <a href="/logout" class="logout-btn">⏻ Log Out</a>
    </div>
  </aside>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

</div>

<div class="toast" id="toast"></div>
<script>
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
